name: Build iOS IPA
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q XOOnline-ios.zip -d app
      - name: Pin .NET 8
        run: echo '{"sdk":{"version":"8.0.100","rollForward":"latestFeature"}}' > global.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: dotnet --version
      - run: dotnet workload install maui
      - name: Build
        run: >
          dotnet build app/XO.Mobile/XO.Mobile.csproj
          -f net8.0-ios -c Release
          -p:RuntimeIdentifier=ios-arm64
          -p:EnableCodeSigning=false
          -p:CodesignRequireProvisioningProfile=false
          -p:CheckEolTargetFramework=false
      - name: Package IPA
        run: |
          APP=$(find app/XO.Mobile/bin/Release -name "*.app" -type d | head -n 1)
          mkdir Payload && cp -R "$APP" Payload/
          zip -r XOOnline-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: XOOnline-ipa
          path: XOOnline-unsigned.ipa
